<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050a12" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050a12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rep Ledger" />
    <title>Rep Ledger</title>
    <script>try{var t=localStorage.getItem("rl-theme");document.documentElement.dataset.theme=t==="light"||t==="auto"?t:"dark"}catch(e){document.documentElement.dataset.theme="dark"};if(navigator.standalone||matchMedia("(display-mode: standalone)").matches)document.documentElement.classList.add("standalone")</script>
    <style>#boot{position:fixed;inset:0;z-index:9998;display:grid;place-items:center;background:#050a12}#boot i{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#22d3ee;animation:bt .8s linear infinite}@keyframes bt{to{transform:rotate(360deg)}}</style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" style="position:fixed;inset:0;z-index:9998;display:grid;place-items:center;background:#050a12"><i></i></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
